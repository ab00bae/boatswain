[project]
name = "boatswain"
version = "0.1.0"
description = "Sprint status reports from GitHub issues and pull requests."
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
boatswain = "boatswain.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
